<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行手帳：機場英文單字大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fdeef3;
    --bg2:#f1e6ff;
    --bg3:#e8f6f0;
    --cream:#fffcf7;
    --paper:#fff6f9;
    --ink:#4a3a52;
    --ink-soft:#7a6a82;
    --rose:#e98cae;
    --rose-deep:#d9668f;
    --lavender:#b9a6e0;
    --lavender-deep:#9c85cc;
    --mint:#63c9a3;
    --peach:#f3b88c;
    --alert:#ec7695;
    --line: rgba(217,102,143,.22);
    --gold:#f0b95e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 10% -10%, var(--bg2) 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, var(--bg3) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg1) 0%, #fff 70%);
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:clamp(12px, 4vw, 28px) 12px 60px;
  }
  h1,h2,h3,.display{font-family:'Fredoka', sans-serif;}
  .mono{font-family:'Quicksand', sans-serif;font-weight:700;}
  #app{width:100%;max-width:560px;}

  /* ---------- responsive breakpoints ---------- */
  @media (min-width:640px){
    #app{max-width:640px;}
    .panel{padding:26px;}
    .flashcard{padding:38px 32px 30px;}
    .flashcard .word{font-size:34px;}
    .board-row{padding:16px;}
    .btn{font-size:16px;padding:13px 20px;}
  }
  @media (min-width:960px){
    #app{max-width:720px;}
    body{padding-top:40px;}
    .stats-row{gap:16px;}
    .board-row{grid-template-columns:52px 1fr auto;}
  }
  @media (max-width:380px){
    .panel{padding:16px;border-radius:16px;}
    .flashcard{padding:22px 16px 18px;min-height:200px;}
    .flashcard .word{font-size:24px;}
    .flashcard .meaning{font-size:15px;}
    .flashcard .sentence{font-size:13px;}
    .stat-box .num{font-size:19px;}
    .btn{font-size:14px;padding:11px 14px;}
    .boarding-pass{flex-direction:column;}
    .bp-stub{flex-direction:row;justify-content:center;gap:8px;padding:12px;}
    .board-row{grid-template-columns:38px 1fr auto;gap:8px;padding:11px;}
    .board-row .num-badge{width:38px;height:38px;font-size:17px;}
  }
  @media (max-width:340px){
    .status-pill{font-size:9.5px;padding:4px 7px;}
    .board-row .dest{font-size:13.5px;}
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .icon{font-size:26px;}
  .brand-text{line-height:1.15;}
  .brand-text b{font-size:18px;font-family:'Fredoka';color:var(--rose-deep);}
  .brand-text span{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;}
  .user-chip{
    font-size:12px;background:#fff;border:1.5px solid var(--line);
    padding:6px 12px;border-radius:20px;display:flex;gap:8px;align-items:center;
    box-shadow:0 3px 8px rgba(217,102,143,.12);
  }
  .user-chip button{
    background:none;border:none;color:var(--rose-deep);font-weight:800;cursor:pointer;font-size:12px;
    font-family:'Nunito';
  }
  .audio-toggle{
    font-size:11.5px;background:#fff;border:1.5px solid var(--line);border-radius:20px;
    padding:5px 10px;cursor:pointer;color:var(--ink-soft);font-weight:700;
  }
  .audio-toggle.on{background:var(--lavender);color:#fff;border-color:var(--lavender-deep);}
  .storage-warn{
    background:rgba(236,118,149,.12);border:1px dashed var(--alert);color:var(--alert);
    font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:12px;margin-bottom:14px;text-align:center;
  }

  /* ---------- cards / panels ---------- */
  .panel{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 8px 22px rgba(217,102,143,.08);
    position:relative;
  }
  .panel h2{margin:0 0 4px;color:var(--rose-deep);font-size:19px;}
  .muted{color:var(--ink-soft);font-size:13px;line-height:1.5;}

  /* ---------- buttons ---------- */
  button{font-family:'Nunito',sans-serif;}
  .btn{
    display:inline-block;border:none;border-radius:14px;padding:12px 18px;
    font-weight:800;cursor:pointer;font-size:15px;transition:transform .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-rose{background:linear-gradient(135deg, var(--rose), var(--rose-deep));color:#fff;}
  .btn-ghost{background:#fff;border:1.5px solid var(--rose);color:var(--rose-deep);}
  .btn-mint{background:var(--mint);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .speak-btn{
    background:var(--lavender);color:#fff;border:none;border-radius:50%;
    width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(156,133,204,.4);
  }
  .speak-btn:active{transform:scale(.9);}
  .speak-btn.small{width:28px;height:28px;font-size:12px;}

  /* ---------- login ---------- */
  .login-wrap{margin-top:8px;text-align:center;}
  .stamp{
    width:76px;height:76px;border-radius:50%;
    background:linear-gradient(135deg,var(--lavender),var(--rose));
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
    font-size:32px;box-shadow:0 8px 18px rgba(217,102,143,.3);
  }
  .field{margin-bottom:12px;text-align:left;}
  .field label{display:block;font-size:12px;margin-bottom:5px;color:var(--ink-soft);letter-spacing:.03em;font-weight:700;}
  .field input{
    width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink);font-size:15px;
  }
  .field input:focus{outline:2px solid var(--rose);}
  .tab-switch{display:flex;gap:8px;margin-bottom:16px;}
  .tab-switch button{flex:1;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:700;cursor:pointer;}
  .tab-switch button.active{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-color:transparent;}
  .error-msg{color:var(--alert);font-size:13px;margin:6px 0 0;font-weight:700;text-align:left;}

  /* ---------- dashboard stats ---------- */
  .stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .stat-box{
    flex:1;min-width:88px;background:#fff;border-radius:16px;padding:12px 10px;text-align:center;
    border:1.5px solid var(--line);
  }
  .stat-box .num{font-family:'Quicksand';font-weight:700;font-size:22px;color:var(--rose-deep);}
  .stat-box .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .checkin-banner{
    background:linear-gradient(90deg, rgba(240,185,94,.18), rgba(240,185,94,.04));
    border:1.5px dashed var(--gold);
    border-radius:16px;padding:12px 14px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .review-banner{
    background:rgba(236,118,149,.1);border:1.5px dashed var(--alert);
    border-radius:16px;padding:12px 14px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  }

  /* ---------- journal list (was: departure board) ---------- */
  .board{margin-bottom:18px;}
  .board-row{
    background:#fff;border:1.5px solid var(--line);border-radius:18px;
    display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;
    padding:14px;margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .12s ease;
  }
  .board-row:hover{transform:translateY(-2px);}
  .board-row::before{
    content:'';position:absolute;top:0;left:16px;width:34px;height:12px;
    background:var(--lavender);opacity:.55;transform:rotate(-3deg);border-radius:2px;
  }
  .board-row .num-badge{
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:var(--bg2);
  }
  .board-row .dest{font-weight:800;font-size:15px;color:var(--ink);}
  .board-row .sub{display:block;font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:1px;}
  .status-pill{
    padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;text-align:center;white-space:nowrap;
  }
  .status-locked{background:#eee;color:#aaa;}
  .status-open{background:rgba(236,118,149,.16);color:var(--rose-deep);}
  .status-done{background:rgba(99,201,163,.2);color:#2f9c78;}

  /* ---------- flashcard ---------- */
  .progress-track{height:9px;background:#f1e3ea;border-radius:6px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--lavender));transition:width .25s ease;}
  .flashcard{
    background:var(--paper);color:var(--ink);border-radius:22px;padding:30px 22px 24px;
    min-height:230px;display:flex;flex-direction:column;justify-content:center;
    text-align:center;position:relative;margin-bottom:16px;
    border:2px dashed var(--rose);
    box-shadow:0 12px 26px rgba(217,102,143,.15);
  }
  .flashcard::before, .flashcard::after{
    content:'';position:absolute;width:44px;height:16px;background:var(--gold);opacity:.5;top:-6px;
  }
  .flashcard::before{left:20px;transform:rotate(-8deg);}
  .flashcard::after{right:20px;transform:rotate(8deg);}
  .flashcard .word-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .flashcard .word{font-family:'Fredoka';font-size:28px;font-weight:600;}
  .flashcard .meaning{font-size:17px;font-weight:800;color:var(--rose-deep);margin-bottom:14px;}
  .flashcard .sentence-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  .flashcard .sentence{font-size:14.5px;line-height:1.6;font-style:italic;color:#5a4a62;}
  .flashcard .sentence-zh{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .multi-tag{
    display:inline-block;background:var(--peach);color:#5a3a12;font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:20px;margin-bottom:12px;
  }
  .senses-wrap{text-align:left;}
  .sense-block{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed rgba(217,102,143,.25);}
  .sense-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .sense-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .sense-num{
    width:20px;height:20px;border-radius:50%;background:var(--lavender);color:#fff;
    font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .ex-item{margin-bottom:8px;padding-left:2px;}
  .ex-row{display:flex;align-items:center;gap:8px;}
  .ex-en{font-size:13.5px;line-height:1.5;font-style:italic;color:#5a4a62;flex:1;}
  .ex-zh{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .flashcard .hint{position:absolute;top:16px;right:18px;font-size:11px;color:var(--ink-soft);}
  .card-nav{display:flex;justify-content:space-between;gap:10px;}

  /* ---------- quiz ---------- */
  .quiz-q-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px;}
  .quiz-q{font-size:16px;font-weight:700;line-height:1.5;}
  .quiz-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .opt{
    display:block;width:100%;text-align:left;background:var(--paper);
    border:1.5px solid var(--line);color:var(--ink);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer;font-size:14.5px;font-family:'Nunito';font-weight:600;
  }
  .opt:hover{border-color:var(--rose);}
  .opt.correct{background:rgba(99,201,163,.22);border-color:var(--mint);}
  .opt.wrong{background:rgba(236,118,149,.22);border-color:var(--alert);}
  .feedback{font-weight:800;margin:8px 0 2px;font-size:14px;}
  .feedback.ok{color:#2f9c78;}
  .feedback.no{color:var(--alert);}

  .explain-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .explain-item{
    display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;
    font-size:13px;line-height:1.55;
  }
  .explain-item.ok{background:rgba(99,201,163,.14);border:1px solid rgba(99,201,163,.4);color:#276b53;}
  .explain-item.no{background:rgba(236,118,149,.1);border:1px solid rgba(236,118,149,.3);color:#8a4058;}
  .explain-icon{flex-shrink:0;}

  .quiz-emoji{font-size:64px;text-align:center;margin-bottom:10px;}
  .spelling-row{display:flex;gap:8px;align-items:center;}
  .spelling-input{
    flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink);font-size:16px;letter-spacing:.03em;
  }
  .spelling-input:focus{outline:2px solid var(--rose);}
  .spelling-your-answer{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:13.5px;color:var(--ink-soft);margin-top:4px;
  }
  .type-opt-list{display:flex;flex-direction:column;gap:10px;}
  .type-opt{
    display:block;width:100%;text-align:left;background:var(--paper);
    border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;
    font-family:'Nunito';
  }
  .type-opt.active{background:rgba(236,118,149,.14);border-color:var(--rose);}
  .type-opt-label{font-weight:800;font-size:14.5px;color:var(--ink);margin-bottom:2px;}
  .type-opt.active .type-opt-label{color:var(--rose-deep);}
  .type-opt-desc{font-size:12px;color:var(--ink-soft);}

  /* ---------- result / postcard ---------- */
  .boarding-pass{
    background:var(--paper);color:var(--ink);border-radius:20px;overflow:hidden;
    display:flex;box-shadow:0 12px 26px rgba(217,102,143,.2);margin-bottom:18px;
    border:2px dashed var(--lavender);
  }
  .bp-main{flex:3;padding:20px;}
  .bp-stub{
    flex:1;background:linear-gradient(160deg,var(--lavender),var(--rose));color:#fff;padding:20px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  .bp-main .t1{font-size:11px;letter-spacing:.1em;color:var(--ink-soft);font-weight:700;}
  .bp-main .t2{font-family:'Fredoka';font-size:21px;font-weight:600;margin:2px 0 10px;color:var(--rose-deep);}
  .bp-main .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px;}
  .bp-main .grid b{display:block;font-family:'Quicksand';font-weight:700;font-size:15px;color:var(--ink);}
  .bp-stub .num{font-family:'Quicksand';font-size:28px;font-weight:700;}

  a.link-btn{color:var(--rose-deep);text-decoration:underline;cursor:pointer;font-size:13px;font-weight:700;}
  .footer-note{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
  .center{text-align:center;}
  .mb0{margin-bottom:0;}
  ::selection{background:var(--rose);color:#fff;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   資料：90 個機場情境英文單字（4 個關卡，難度漸增）
   ============================================================ */
const WORDS = [
{id:1,level:1,word:"airport",senses:[{pos:"n.",meaning:"機場",examples:[{en:"We arrived at the airport two hours before our international flight.",zh:"我們在國際航班起飛前兩小時抵達機場。"}]}]},
{id:2,level:1,word:"passport",senses:[{pos:"n.",meaning:"護照",examples:[{en:"Please have your passport and boarding pass ready for inspection.",zh:"請準備好您的護照和登機證以供檢查。"}]}]},
{id:3,level:1,word:"luggage",senses:[{pos:"n.",meaning:"行李（不可數）",examples:[{en:"How many pieces of luggage are you checking in today?",zh:"您今天總共要託運幾件行李？"}]}]},
{id:4,level:1,word:"luggage cart",senses:[{pos:"n.",meaning:"行李推車",examples:[{en:"He used a luggage cart to transport all the heavy suitcases.",zh:"他用行李推車來搬運所有沉重的行李箱。"}]}]},
{id:5,level:1,word:"ticket",senses:[{pos:"n.",meaning:"票",examples:[{en:"I booked my return ticket online last week.",zh:"我上週在網路上預訂了回程機票。"}]},{pos:"n.",meaning:"罰單",examples:[{en:"He got a speeding ticket on his way to the airport.",zh:"他在去機場的路上吃了一張超速罰單。"}]}]},
{id:6,level:1,word:"counter",senses:[{pos:"n.",meaning:"櫃檯",examples:[{en:"The airline counter is located on the second floor of the terminal.",zh:"航空公司櫃檯位於航廈的二樓。"}]},{pos:"n./v.",meaning:"反擊",examples:[{en:"The boxer made a quick counter after dodging the punch.",zh:"拳擊手在閃過那一拳後迅速做出反擊。"}]}]},
{id:7,level:1,word:"check-in counter",senses:[{pos:"n.",meaning:"報到櫃檯",examples:[{en:"Line up at the check-in counter to get your seat assignment.",zh:"在報到櫃檯排隊以取得您的座位分配。"}]}]},
{id:8,level:1,word:"boarding pass",senses:[{pos:"n.",meaning:"登機證",examples:[{en:"Keep your boarding pass with you at all times; you will need it to board the plane.",zh:"隨身保管好您的登機證；登機時會需要用到它。"}]}]},
{id:9,level:1,word:"gate",senses:[{pos:"n.",meaning:"登機門",examples:[{en:"Flight BR128 is now boarding at gate B4.",zh:"BR128 班機目前正在 B4 登機門進行登機。"}]},{pos:"n.",meaning:"大門",examples:[{en:"Please close the garden gate behind you.",zh:"請隨手關好後面的花園大門。"}]}]},
{id:10,level:1,word:"flight",senses:[{pos:"n.",meaning:"班機",examples:[{en:"Our flight was delayed by thirty minutes because of the heavy rain.",zh:"我們的班機因為大雨延誤了三十分鐘。"}]},{pos:"n.",meaning:"飛行",examples:[{en:"The birds began their long flight to the south for winter.",zh:"鳥兒們開始了它們過冬向南的漫長飛行。"}]}]},
{id:11,level:1,word:"passenger",senses:[{pos:"n.",meaning:"乘客",examples:[{en:"All passengers are requested to remain seated during takeoff.",zh:"敬請所有乘客在起飛期間保持就座。"}]}]},
{id:12,level:1,word:"agent",senses:[{pos:"n.",meaning:"地勤人員／服務人員",examples:[{en:"The airline agent helped us change our seats to the front row.",zh:"航空公司地勤人員幫我們把座位換到了前排。"}]},{pos:"n.",meaning:"間諜／代理人",examples:[{en:"The movie is about a secret agent on a dangerous mission.",zh:"這部電影講述的是一個身負危險任務的祕密特務（間諜）。"}]}]},
{id:13,level:1,word:"purse",senses:[{pos:"n.",meaning:"（女用）手提包、錢包",examples:[{en:"She left her purse on the chair near the waiting area.",zh:"她把女用手提包忘在等候區附近的椅子上了。"}]}]},
{id:14,level:1,word:"belt",senses:[{pos:"n.",meaning:"皮帶",examples:[{en:"You need to take off your belt and shoes before going through the metal detector.",zh:"通過金屬探測器前，你需要脫下皮帶和鞋子。"}]},{pos:"n.",meaning:"安全帶",examples:[{en:"Fasten your seat belt before the plane starts moving.",zh:"在飛機開始移動前繫好安全帶。"}]}]},
{id:15,level:1,word:"bottle",senses:[{pos:"n.",meaning:"瓶子",examples:[{en:"Please empty your water bottle before passing security.",zh:"通過安檢前請先將水瓶清空。"}]}]},
{id:16,level:1,word:"dictionary",senses:[{pos:"n.",meaning:"字典",examples:[{en:"I always carry an electronic dictionary when traveling abroad to translate new words.",zh:"我出國旅遊時總是隨身攜帶電子字典來翻譯生字。"}]}]},
{id:17,level:1,word:"terminal",senses:[{pos:"n.",meaning:"航廈",examples:[{en:"International flights usually depart from Terminal 2.",zh:"國際航班通常從第二航廈出發。"}]},{pos:"n.",meaning:"終端機",examples:[{en:"The system crashed, and the computer terminal went blank.",zh:"系統當機了，電腦終端機畫面變成一片空白。"}]}]},

/* ============================================================
   語音朗讀輔助（Web Speech API）
   ============================================================ */
let audioOn = true;
let cachedVoices = [];
function refreshVoices(){
  if(!('speechSynthesis' in window)) return;
  const v = window.speechSynthesis.getVoices();
  if(v && v.length) cachedVoices = v;
}
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickEnglishVoice(){
  if(!cachedVoices.length) refreshVoices();
  // 優先選美式英文語音，其次任何英文語音
  return cachedVoices.find(v=>/^en-US/i.test(v.lang) && /google|natural|samantha|microsoft/i.test(v.name||''))
      || cachedVoices.find(v=>/^en-US/i.test(v.lang))
      || cachedVoices.find(v=>v.lang && v.lang.toLowerCase().startsWith('en'))
      || null;
}
function speakRaw(text, rate){
  if(!audioOn || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || 1;
  u.pitch = 1;
  const v = pickEnglishVoice();
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}
// 先取消目前播放，稍微延遲再念新內容，避免開頭被吃掉造成發音怪異
function speakNow(text, rate){
  if(!audioOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  setTimeout(()=>speakRaw(text, rate), 80);
}
function speakWord(word){ speakNow(word, 0.95); }
function speakSentence(sentence){ speakNow(sentence, 1); }
// 唸出填空句子時，跳過答案單字，避免聽力直接洩題
function speakBlankSentence(sentence, word){
  if(!audioOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const idx = sentence.search(re);
  setTimeout(()=>{
    if(idx<0){ speakRaw(sentence, 1); return; }
    const before = sentence.slice(0, idx);
    const after = sentence.slice(idx+word.length);
    if(before.trim()) speakRaw(before, 1);
    speakRaw('... hmm ...', 1);
    if(after.trim()) speakRaw(after, 1);
  }, 80);
}

/* ============================================================
   儲存層：優先使用雲端 window.storage（帳號跨裝置同步）
   若環境沒有提供（例如直接用瀏覽器開啟下載的 HTML 檔），
   自動退回瀏覽器本機 localStorage，避免帳號登入後就消失
   ============================================================ */
const LS_PREFIX = 'travelDiaryVocab_';
let storageMode = 'checking'; // 'cloud' | 'local' | 'none'

function hasCloudStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
function hasLocalStorage(){
  try{
    const t = '__test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
async function storageGetRaw(key, shared){
  if(hasCloudStorage()){
    storageMode = 'cloud';
    try{
      const r = await window.storage.get(key, shared);
      return r ? r.value : null;
    }catch(e){
      // 這個 key 目前沒有資料屬於正常情況，不代表雲端儲存故障
      return null;
    }
  }
  if(hasLocalStorage()){
    storageMode = 'local';
    return localStorage.getItem(LS_PREFIX+key);
  }
  storageMode = 'none';
  return null;
}
async function storageSetRaw(key, value, shared){
  if(hasCloudStorage()){
    storageMode = 'cloud';
    try{
      const r = await window.storage.set(key, value, shared);
      if(r) return true;
    }catch(e){ /* 雲端寫入失敗，往下嘗試本機備援 */ }
  }
  if(hasLocalStorage()){
    try{
      localStorage.setItem(LS_PREFIX+key, value);
      if(storageMode!=='cloud') storageMode='local';
      return true;
    }catch(e){}
  }
  if(storageMode!=='cloud') storageMode='none';
  return false;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];

/* ============================================================
   五種測驗題型的題目產生器
   ============================================================ */
function pickRandomExample(sense){ return sense.examples[Math.floor(Math.random()*sense.examples.length)]; }
function pickRandomSense(word){ return word.senses[Math.floor(Math.random()*word.senses.length)]; }

// 1) 選擇句型：給一個單字＋指定意思，選出正確示範用法的句子
function buildSentenceQuestion(word, pool){
  const senseIdx = Math.floor(Math.random()*word.senses.length);
  const targetSense = word.senses[senseIdx];
  const correctEx = pickRandomExample(targetSense);
  let distractors = [];
  word.senses.forEach((s,i)=>{
    if(i!==senseIdx) s.examples.forEach(ex=>distractors.push({en:ex.en, zh:ex.zh, sourceWord:word, sourceSense:s}));
  });
  const others = shuffle(pool.filter(w=>w.id!==word.id));
  let oi=0;
  while(distractors.length<3 && oi<others.length){
    const ow = others[oi++]; const os = pickRandomSense(ow); const oe = pickRandomExample(os);
    distractors.push({en:oe.en, zh:oe.zh, sourceWord:ow, sourceSense:os});
  }
  distractors = shuffle(distractors).slice(0,3);
  const optionData = shuffle([
    {en:correctEx.en, zh:correctEx.zh, sourceWord:word, sourceSense:targetSense, isCorrect:true},
    ...distractors.map(d=>({...d, isCorrect:false}))
  ]);
  return {
    kind:'choice', qtype:'sentence', typeLabel:'📖 選擇句型',
    prompt:`哪一句話正確用出「${word.word}」表示「${targetSense.meaning}」（${targetSense.pos}）的意思？`,
    sub: word.senses.length>1 ? `提醒：這個字有 ${word.senses.length} 種意思，看清楚題目問的是哪一種！` : `選出正確使用這個字的句子`,
    options: optionData.map(o=>o.en), optionMeta: optionData, word, targetSense
  };
}
// 2) 拼單字：給意思與例句提示，打出正確拼法
function buildSpellingQuestion(word){
  const sense = pickRandomSense(word);
  const ex = pickRandomExample(sense);
  return {
    kind:'spelling', qtype:'spelling', typeLabel:'✍️ 拼單字',
    prompt:`請拼出這個單字：「${sense.pos} ${sense.meaning}」`,
    sub:`例句提示：${ex.zh}`,
    word, targetSense:sense, targetExample:ex
  };
}
// 3) 看圖選字：看表情符號圖案，選出對應的英文單字
function buildPicWordQuestion(word, pool){
  const emoji = EMOJI_MAP[word.id];
  const emojiPool = pool.filter(w=>w.id!==word.id && EMOJI_MAP[w.id]);
  const basePool = emojiPool.length>=3 ? emojiPool : pool.filter(w=>w.id!==word.id);
  const distractors = sample(basePool, 3);
  const optionWords = shuffle([word, ...distractors]);
  return {
    kind:'choice', qtype:'pic-word', typeLabel:'🖼️ 看圖選字',
    prompt:`這張圖是哪個單字？`, sub:'', emoji,
    options: optionWords.map(w=>w.word),
    optionMeta: optionWords.map(w=>({en:w.word, zh:w.senses[0].meaning, sourceWord:w, sourceSense:w.senses[0], isCorrect:w.id===word.id})),
    word, targetSense: word.senses[0]
  };
}
// 4) 看圖選句：看表情符號圖案，選出跟圖片有關的句子
function buildPicSentenceQuestion(word, pool){
  const emoji = EMOJI_MAP[word.id];
  const sense = pickRandomSense(word);
  const correctEx = pickRandomExample(sense);
  const emojiPool = pool.filter(w=>w.id!==word.id && EMOJI_MAP[w.id]);
  const basePool = emojiPool.length>=3 ? emojiPool : pool.filter(w=>w.id!==word.id);
  const distractors = sample(basePool, 3).map(ow=>{
    const os = pickRandomSense(ow); const oe = pickRandomExample(os);
    return {en:oe.en, zh:oe.zh, sourceWord:ow, sourceSense:os, isCorrect:false};
  });
  const optionData = shuffle([{en:correctEx.en, zh:correctEx.zh, sourceWord:word, sourceSense:sense, isCorrect:true}, ...distractors]);
  return {
    kind:'choice', qtype:'pic-sentence', typeLabel:'🖼️ 看圖選句',
    prompt:`哪一句話跟這張圖有關？`, sub:'', emoji,
    options: optionData.map(o=>o.en), optionMeta: optionData, word, targetSense: sense
  };
}
// 每個單字隨機抽一種適用的題型；若學生指定了想練習的題型，優先使用（沒有配圖的字碰到看圖題會自動改抽別種）
function buildQuizQuestion(word, pool, forcedType){
  const types = ['sentence','spelling'];
  if(EMOJI_MAP[word.id]){ types.push('pic-word','pic-sentence'); }
  let type;
  if(forcedType && forcedType!=='random' && types.includes(forcedType)){
    type = forcedType;
  }else{
    type = types[Math.floor(Math.random()*types.length)];
  }
  if(type==='sentence') return buildSentenceQuestion(word, pool);
  if(type==='spelling') return buildSpellingQuestion(word);
  if(type==='pic-word') return buildPicWordQuestion(word, pool);
  return buildPicSentenceQuestion(word, pool);
}

function resetQuizState(){
  app.quizIdx=0; app.quizScore=0; app.quizAnswered=false; app.quizChosenIdx=null;
  app.quizCorrect=null; app.showWordReview=false; app.spellingValue='';
}
function startLevelQuiz(levelId, quizType){
  const pool = WORDS.filter(w=>w.level===levelId);
  app.currentLevel = levelId;
  app.quizMode='level';
  app.quizQueue = shuffle(pool).map(w=>buildQuizQuestion(w, pool, quizType));
  resetQuizState();
  app.view='quiz'; render();
}
function startFinalTest(quizType){
  const n = Math.min(20, WORDS.length);
  const chosen = sample(WORDS, n);
  app.quizMode='final';
  app.quizQueue = chosen.map(w=>buildQuizQuestion(w, WORDS.filter(x=>x.level===w.level), quizType));
  resetQuizState();
  app.view='quiz'; render();
}
function startReview(quizType){
  const ids = dueWordIds();
  const words = ids.map(wordById).filter(Boolean);
  app.quizMode='review';
  app.quizQueue = words.map(w=>buildQuizQuestion(w, WORDS.filter(x=>x.level===w.level), quizType));
  resetQuizState();
  app.view='quiz'; render();
}

   測驗前的題型選擇畫面

  {id:'pic-sentence', label:'🖼️ 看圖選句', desc:'看圖選出相關句子（沒配圖的字會自動換題型）'},

/* ============================================================
   測驗畫面渲染（依題型分支）
   ============================================================ */
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function renderChoiceBody(q, answered){
  const optsHtml = q.options.map((opt,i)=>{
    let cls='opt';
    if(answered){
      const isCorrect = q.optionMeta[i].isCorrect;
      if(isCorrect) cls+=' correct';
      else if(i===app.quizChosenIdx) cls+=' wrong';
    }
    return `<button class="${cls}" data-idx="${i}" ${answered?'disabled':''}>${opt}</button>`;
  }).join('');
  return `<div id="optsWrap">${optsHtml}</div>`;
}
function renderSpellingBody(q, answered){
  if(answered){
    return `<div class="spelling-your-answer">你輸入的是：「${app.spellingValue || '（空白）'}」</div>`;
  }
  return `
  <div class="spelling-row">
    <input type="text" id="spellingInput" class="spelling-input" placeholder="輸入英文單字..." autocomplete="off" autocapitalize="off" spellcheck="false" value="${escapeAttr(app.spellingValue)}">
    <button class="speak-btn" id="speakSpellBtn">🔊</button>
  </div>
  <button class="btn btn-rose btn-block" id="submitSpelling" style="margin-top:10px;">送出答案 ✏️</button>
  `;
}

function buildExplanationHtml(q){
  if(q.kind==='choice'){
    return '<div class="explain-list">' + q.options.map((opt,i)=>{
      const om = q.optionMeta[i];
      const isCorrect = om.isCorrect;
      let text;
      if(q.qtype==='sentence'){
        if(isCorrect){
          text = `這句話正確示範了 <b>${q.word.word}</b>（${q.targetSense.pos} ${q.targetSense.meaning}）：${om.zh}`;
        }else if(om.sourceWord.id===q.word.id){
          text = `這句話也是用 <b>${q.word.word}</b>，但這裡是「${om.sourceSense.meaning}」的意思，不是題目問的「${q.targetSense.meaning}」！這個字要小心分辨不同意思喔。`;
        }else{
          text = `這句話用的是 <b>${om.sourceWord.word}</b>（${om.sourceSense.meaning}），不是 <b>${q.word.word}</b> 的用法。`;
        }
      }else if(q.qtype==='pic-word'){
        text = isCorrect
          ? `沒錯，這張圖代表 <b>${q.word.word}</b>（${q.word.senses[0].meaning}）！`
          : `「${om.en}」的意思是「${om.zh}」，不是這張圖。這張圖其實是 <b>${q.word.word}</b>（${q.word.senses[0].meaning}）。`;
      }else{
        text = isCorrect
          ? `這句話跟圖片相符，用了 <b>${q.word.word}</b>（${om.sourceSense.meaning}）：${om.zh}`
          : `這句話講的是 <b>${om.sourceWord.word}</b>（${om.sourceSense.meaning}），跟圖片內容不符。`;
      }
      return `<div class="explain-item ${isCorrect?'ok':'no'}"><span class="explain-icon">${isCorrect?'✅':'❌'}</span><span>${text}</span></div>`;
    }).join('') + '</div>';
  }
  if(q.kind==='spelling'){
    const correct = app.quizCorrect;
    const text = `${correct?'拼對了！':'正確拼法是'} <b>${q.word.word}</b>（${q.targetSense.pos} ${q.targetSense.meaning}）。例句：<i>"${q.targetExample.en}"</i>（${q.targetExample.zh}）`;
    return `<div class="explain-list"><div class="explain-item ${correct?'ok':'no'}"><span class="explain-icon">${correct?'✅':'❌'}</span><span>${text}</span></div></div>`;
  }
  return '';
}

function renderQuizHTML(){
  const q = app.quizQueue[app.quizIdx];
  if(!q) return `<div class="panel center">這一關沒有題目喔。</div>`;
  const total = app.quizQueue.length;
  const pct = Math.round(app.quizIdx/total*100);
  const titleMap = {level:'🎯 關卡測驗', final:'👑 綜合大冒險', review:'🔁 複習時間'};
  const answered = app.quizAnswered;

  let bodyHtml = '';
  if(q.kind==='choice') bodyHtml = renderChoiceBody(q, answered);
  else if(q.kind==='spelling') bodyHtml = renderSpellingBody(q, answered);

  let feedbackHtml = '';
  let explainHtml = '';
  if(answered){
    feedbackHtml = app.quizCorrect
      ? `<div class="feedback ok">✅ 答對了！太棒了！</div>`
      : `<div class="feedback no">❌ 答錯了，看看下面的說明！</div>`;
    explainHtml = buildExplanationHtml(q);
  }

  const isLast = app.quizIdx === total-1;
  const actionButtons = answered ? `
    <div class="row" style="margin-top:12px;">
      <button class="btn btn-ghost" id="reviewWordBtn">🔁 再複習一次</button>
      <button class="btn btn-rose" id="quizNext" style="flex:1;">${isLast?'查看結果 🏁':'下一題 ➡'}</button>
    </div>
    ${app.showWordReview ? renderMiniFlashcardHTML(q.word) : ''}
  ` : '';

  const emojiHtml = q.emoji ? `<div class="quiz-emoji">${q.emoji}</div>` : '';
  const speakQ = (q.kind==='choice' && q.qtype==='sentence') ? `<button class="speak-btn small" id="speakQBtn">🔊</button>` : '';

  return `
  <div class="panel">
    <h2>${titleMap[app.quizMode]} · ${q.typeLabel}</h2>
    <p class="muted mb0">第 ${app.quizIdx+1} / ${total} 題　目前得分：${app.quizScore}</p>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="panel">
    ${emojiHtml}
    <div class="quiz-q-row">
      <div class="quiz-q">${q.prompt}</div>
      ${speakQ}
    </div>
    ${q.sub ? `<div class="quiz-sub">${q.sub}</div>` : ''}
    ${bodyHtml}
    ${feedbackHtml}
    ${explainHtml}
    ${actionButtons}
  </div>
  `;
}

function renderMiniFlashcardHTML(w){
  return `
  <div class="flashcard" style="margin-top:14px;min-height:auto;padding:22px 18px 18px;">
    <span class="hint">再複習一次</span>
    <div class="word-row">
      <div class="word">${w.word}</div>
      <button class="speak-btn" id="speakReviewWordBtn">🔊</button>
    </div>
    <div class="meaning">${w.pos} ${w.meaning}</div>
    <div class="sentence-row">
      <div class="sentence">"${w.sentence}"</div>
      <button class="speak-btn small" id="speakReviewSentBtn">🔊</button>
    </div>
    <div class="sentence-zh">${w.zh}</div>
    ${w.senses.length>1 ? `<div class="multi-tag" style="margin-top:10px;">這個字還有 ${w.senses.length-1} 種其他意思，回學習頁可以看完整版喔！</div>` : ''}
  </div>
  <button class="btn btn-ghost btn-block" id="closeWordReview">關閉複習卡片</button>
  `;
}

function updateBox(wordId, correct){
  if(!app.progress.box) app.progress.box = {};
  const rec = app.progress.box[wordId] || {box:0, dueAt:0};
  if(correct){
    rec.box = Math.min(5, (rec.box||0)+1);
  }else{
    rec.box = 1;
  }
  rec.dueAt = Date.now() + BOX_INTERVAL_MS[rec.box];
  app.progress.box[wordId] = rec;
}

/* ---------------- 各題型作答處理 ---------------- */
async function commitAnswer(correct){
  const q = app.quizQueue[app.quizIdx];
  app.quizAnswered = true;
  app.quizCorrect = correct;
  if(correct) app.quizScore++;
  updateBox(q.word.id, correct);
  await saveProgress(app.progress);
  render();
}
async function handleOptClick(idx){
  if(app.quizAnswered) return;
  const q = app.quizQueue[app.quizIdx];
  app.quizChosenIdx = idx;
  const correct = q.optionMeta[idx].isCorrect;
  if(q.qtype==='sentence') speakWord(q.word.word);
  await commitAnswer(correct);
}
async function handleSpellingSubmit(){
  if(app.quizAnswered) return;
  const q = app.quizQueue[app.quizIdx];
  const inputEl = document.getElementById('spellingInput');
  const val = inputEl ? inputEl.value : '';
  app.spellingValue = val;
  const norm = s => (s||'').toLowerCase().trim().replace(/[-\s]+/g,' ');
  const correct = norm(val) === norm(q.word.word);
  speakWord(q.word.word);
  await commitAnswer(correct);
}

async function nextQuizStep(){
  if(app.quizIdx === app.quizQueue.length-1){
    await finishQuiz();
  }else{
    app.quizIdx++;
    app.quizAnswered=false;
    app.quizChosenIdx=null;
    app.quizCorrect=null;
    app.showWordReview=false;
    app.spellingValue='';
    render();
  }
}
async function finishQuiz(){
  const total = app.quizQueue.length;
  const ratio = total>0 ? app.quizScore/total : 0;
  const pass = ratio >= PASS_SCORE;
  const starsEarned = app.quizScore;
  app.progress.stars += starsEarned;

  if(app.quizMode==='level'){
    const lv = app.currentLevel;
    app.progress.bestScore[lv] = Math.max(app.progress.bestScore[lv]||0, app.quizScore);
    if(pass) app.progress.levelPassed[lv] = true;
  }else if(app.quizMode==='final'){
    app.progress.bestScore.final = Math.max(app.progress.bestScore.final||0, app.quizScore);
    if(pass) app.progress.finalPassed = true;
  }
  await saveProgress(app.progress);
  app.lastResult = {total, score:app.quizScore, pass, mode:app.quizMode, starsEarned};
  app.view='result';
  render();
}

/* ---------------- REVIEW landing ---------------- */
function renderReviewHTML(){
  return `<div class="panel center">準備複習中...</div>`;
}

/* ---------------- RESULT / POSTCARD ---------------- */
function renderResultHTML(){
  const r = app.lastResult;
  const titleMap = {level:LEVELS.find(l=>l.id===app.currentLevel)?.name || '關卡', final:'綜合大冒險', review:'複習'};
  const pctText = r.total>0 ? Math.round(r.score/r.total*100) : 0;
  const passLine = r.mode==='review'
    ? `複習完成！這些單字的複習時間已經更新，系統會依照遺忘曲線幫你安排下一次複習。`
    : (r.pass ? `恭喜通過測驗，這一頁手帳蓋章完成 🌸！` : `還差一點，未達 70% 通過門檻，再練習一次就能蓋章囉！`);

  return `
  <div class="boarding-pass">
    <div class="bp-main">
      <div class="t1">MY TRAVEL DIARY</div>
      <div class="t2">${titleMap[r.mode]}</div>
      <div class="grid">
        <div>暱稱<br><b>${app.nickname}</b></div>
        <div>正確率<br><b>${pctText}%</b></div>
        <div>答對題數<br><b>${r.score} / ${r.total}</b></div>
        <div>獲得星星<br><b>+${r.starsEarned} ⭐</b></div>
      </div>
    </div>
    <div class="bp-stub">
      <div class="num">${r.mode==='review' ? '✓' : (r.pass?'💖':'💧')}</div>
      <div style="font-size:11px;margin-top:6px;">${r.mode==='review' ? 'DONE' : (r.pass?'PASSED':'RETRY')}</div>
    </div>
  </div>
  <div class="panel center">
    <p class="muted">${passLine}</p>
    <div class="row" style="justify-content:center;">
      ${r.mode==='level' && !r.pass ? `<button class="btn btn-rose" id="retryBtn">再測一次</button>` : ''}
      <button class="btn btn-ghost" id="backDash2">回我的手帳</button>
    </div>
  </div>
  `;
}

/* ============================================================
   事件綁定（每次 render 後呼叫）
   ============================================================ */
function bindDynamic(){
  const editNicknameBtn = document.getElementById('editNicknameBtn');
  if(editNicknameBtn) editNicknameBtn.onclick = ()=>{ app.editingNickname = true; render(); };
  const saveNicknameBtn = document.getElementById('saveNicknameBtn');
  if(saveNicknameBtn) saveNicknameBtn.onclick = async ()=>{
    const val = document.getElementById('nicknameInput').value.trim();
    app.nickname = val || app.nickname;
    app.editingNickname = false;
    await saveNickname(app.nickname);
    render();
  };

  const audioToggle = document.getElementById('audioToggle');
  if(audioToggle) audioToggle.onclick = ()=>{ audioOn = !audioOn; render(); };

  const checkinBtn = document.getElementById('checkinBtn');
  if(checkinBtn) checkinBtn.onclick = handleCheckIn;

  const reviewBtn = document.getElementById('reviewBtn');
  if(reviewBtn) reviewBtn.onclick = ()=>{ app.pendingQuizStart={kind:'review'}; app.selectedQuizType='random'; app.view='quizSetup'; render(); };

  document.querySelectorAll('.board-row').forEach(row=>{
    row.onclick = ()=>{
      const locked = row.getAttribute('data-locked')==='1';
      if(locked){ alert('這一頁還沒解鎖喔，先完成前面的關卡吧！'); return; }
      const lv = row.getAttribute('data-level');
      if(lv==='final'){ app.pendingQuizStart={kind:'final'}; app.selectedQuizType='random'; app.view='quizSetup'; render(); }
      else{ startLevel(Number(lv)); }
    };
  });

  const learnPrev = document.getElementById('learnPrev');
  if(learnPrev) learnPrev.onclick = ()=>{ app.learnIdx=Math.max(0,app.learnIdx-1); render(); };
  const learnNext = document.getElementById('learnNext');
  if(learnNext) learnNext.onclick = ()=>{
    const words = WORDS.filter(w=>w.level===app.currentLevel);
    if(app.learnIdx===words.length-1){
      app.pendingQuizStart={kind:'level', levelId:app.currentLevel}; app.selectedQuizType='random'; app.view='quizSetup'; render();
    }else{ app.learnIdx++; render(); }
  };
  const backDash = document.getElementById('backDash');
  if(backDash) backDash.onclick = ()=>{ app.view='dashboard'; render(); };
  const backDash2 = document.getElementById('backDash2');
  if(backDash2) backDash2.onclick = ()=>{ app.view='dashboard'; render(); };
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.onclick = ()=>{
    app.pendingQuizStart={kind:'level', levelId:app.currentLevel}; app.selectedQuizType='random'; app.view='quizSetup'; render();
  };
  document.querySelectorAll('.type-opt').forEach(b=>{
    b.onclick = ()=>{ app.selectedQuizType = b.getAttribute('data-type'); render(); };
  });
  const startQuizBtn = document.getElementById('startQuizBtn');
  if(startQuizBtn) startQuizBtn.onclick = ()=>{
    const p = app.pendingQuizStart || {kind:'level', levelId:app.currentLevel};
    if(p.kind==='level') startLevelQuiz(p.levelId, app.selectedQuizType);
    else if(p.kind==='final') startFinalTest(app.selectedQuizType);
    else startReview(app.selectedQuizType);
  };
  const backDashFromSetup = document.getElementById('backDashFromSetup');
  if(backDashFromSetup) backDashFromSetup.onclick = ()=>{ app.view='dashboard'; render(); };

  document.querySelectorAll('#optsWrap .opt').forEach(b=>{
    b.onclick = ()=>handleOptClick(Number(b.getAttribute('data-idx')));
  });

  const quizNext = document.getElementById('quizNext');
  if(quizNext) quizNext.onclick = nextQuizStep;

  const reviewWordBtn = document.getElementById('reviewWordBtn');
  if(reviewWordBtn) reviewWordBtn.onclick = ()=>{ app.showWordReview = true; render(); };
  const closeWordReview = document.getElementById('closeWordReview');
  if(closeWordReview) closeWordReview.onclick = ()=>{ app.showWordReview = false; render(); };

  // 拼單字題型
  const spellingInput = document.getElementById('spellingInput');
  if(spellingInput){
    spellingInput.focus();
    spellingInput.onkeydown = (e)=>{ if(e.key==='Enter'){ handleSpellingSubmit(); } };
  }
  const submitSpelling = document.getElementById('submitSpelling');
  if(submitSpelling) submitSpelling.onclick = handleSpellingSubmit;
  const speakSpellBtn = document.getElementById('speakSpellBtn');
  if(speakSpellBtn){
    const q = app.quizQueue[app.quizIdx];
    speakSpellBtn.onclick = ()=>speakSentence(q.targetExample.en);
  }

  // 聽力輔助按鈕
  const speakWordBtn = document.getElementById('speakWordBtn');
  if(speakWordBtn){
    const words = WORDS.filter(w=>w.level===app.currentLevel);
    speakWordBtn.onclick = ()=>speakWord(words[app.learnIdx].word);
  }
  document.querySelectorAll('[data-speak-en]').forEach(btn=>{
    btn.onclick = ()=>{
      const words = WORDS.filter(w=>w.level===app.currentLevel);
      const w = words[app.learnIdx];
      const [si, ei] = btn.getAttribute('data-speak-en').split('-').map(Number);
      speakSentence(w.senses[si].examples[ei].en);
    };
  });
  const speakQBtn = document.getElementById('speakQBtn');
  if(speakQBtn){
    speakQBtn.onclick = ()=>{
      const q = app.quizQueue[app.quizIdx];
      if(!q) return;
      speakWord(q.word.word); // 只有「選擇句型」題目會顯示這顆按鈕，此時題目已寫出單字，念出來不會洩題
    };
  }
  const speakReviewWordBtn = document.getElementById('speakReviewWordBtn');
  if(speakReviewWordBtn){
    const q = app.quizQueue[app.quizIdx];
    speakReviewWordBtn.onclick = ()=>speakWord(q.word.word);
  }
  const speakReviewSentBtn = document.getElementById('speakReviewSentBtn');
  if(speakReviewSentBtn){
    const q = app.quizQueue[app.quizIdx];
    speakReviewSentBtn.onclick = ()=>speakSentence(q.word.sentence);
  }
}

async function handleCheckIn(){
  const t = todayStr();
  const p = app.progress;
  if(p.lastCheckIn === t) return;
  const yest = new Date(Date.now()-86400000);
  const yestStr = yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');
  p.streak = (p.lastCheckIn===yestStr) ? p.streak+1 : 1;
  p.lastCheckIn = t;
  p.checkInDates.push(t);
  p.stars += 2;
  await saveProgress(p);
  render();
}

   啟動：不需要登入，直接載入本裝置保存的進度與暱稱
   ============================================================ */
(async function init(){
  await storageGetRaw('__probe__', false); // 偵測可用的儲存方式（雲端 / 本機 / 無）
  app.progress = await loadProgress();
  app.nickname = await loadNickname();
  render();
})();
</script>
